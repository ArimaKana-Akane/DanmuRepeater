name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # 兼容两种仓库布局：项目在根目录，或作为 v2/ 子目录
      - name: Verify (typecheck + test + build + dist guard)
        run: |
          set -e
          if [ -f v2/package.json ]; then cd v2; fi
          npm ci
          npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: userscript
          path: '**/dist/*.user.js'
          if-no-files-found: error

  # 打 tag v* 时发布；构建时 GITHUB_REPOSITORY 自动注入 @updateURL/@downloadURL
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Build
        run: |
          set -e
          if [ -f v2/package.json ]; then cd v2; fi
          npm ci
          npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: '**/dist/*.user.js'
          generate_release_notes: true
